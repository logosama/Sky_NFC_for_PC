name: Windows + Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-latest
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GAME_BUILD: "0.35.2 (CL 426499)"

jobs:
  hook-dll:
    name: sky_hook.dll (mingw-w64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Build hook DLL
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc -shared -O2 -static-libgcc \
            -o sky_hook.dll hook/common.c hook/windows.c -lws2_32
          file sky_hook.dll
          x86_64-w64-mingw32-objdump -p sky_hook.dll | grep 'DLL Name'
          if x86_64-w64-mingw32-objdump -p sky_hook.dll | grep -qi 'libgcc'; then
            echo "sky_hook.dll must not depend on libgcc_s"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sky-hook-dll
          path: sky_hook.dll
          if-no-files-found: error
          retention-days: 7

  windows:
    name: PyInstaller (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --version
      - name: Byte-compile check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile badge_inject.py inject_dll.py runtime.py
          python -m py_compile nfc/__init__.py nfc/libnfc_cli.py nfc/pcsc_ctypes.py nfc/remote.py
      - name: Build main tool (onefile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/spec-onefile dist/onefile
          python -m PyInstaller --noconfirm --clean --onefile --noupx \
            --name SkyBadgeInject \
            --add-data "../../config.json;." \
            --collect-submodules nfc \
            --hidden-import nfc.libnfc_cli \
            --hidden-import nfc.pcsc_ctypes \
            --hidden-import nfc.remote \
            --exclude-module termios \
            --distpath dist/onefile \
            --workpath build/onefile \
            --specpath build/spec-onefile \
            badge_inject.py
      - name: Build main tool (onedir)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/spec-onedir dist/onedir
          python -m PyInstaller --noconfirm --clean --onedir --noupx \
            --name SkyBadgeInject \
            --add-data "../../config.json;." \
            --collect-submodules nfc \
            --hidden-import nfc.libnfc_cli \
            --hidden-import nfc.pcsc_ctypes \
            --hidden-import nfc.remote \
            --exclude-module termios \
            --distpath dist/onedir \
            --workpath build/onedir \
            --specpath build/spec-onedir \
            badge_inject.py
      - name: Build DLL injector (onefile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/spec-injector dist/injector
          python -m PyInstaller --noconfirm --clean --onefile --noupx \
            --name SkyBadgeInjector \
            --distpath dist/injector \
            --workpath build/injector \
            --specpath build/spec-injector \
            inject_dll.py
      - name: Smoke-test frozen entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/onefile/SkyBadgeInject.exe
          test -f dist/onedir/SkyBadgeInject/SkyBadgeInject.exe
          test -f dist/injector/SkyBadgeInjector.exe
          ./dist/onefile/SkyBadgeInject.exe --self-test
          ./dist/onedir/SkyBadgeInject/SkyBadgeInject.exe --self-test
          ./dist/injector/SkyBadgeInjector.exe --self-test
      - name: Package onedir zip
        shell: bash
        run: |
          set -euo pipefail
          cp config.json dist/onedir/SkyBadgeInject/config.json
          cp README.md dist/onedir/SkyBadgeInject/README.md
          (cd dist/onedir && python -m zipfile -c ../../SkyBadgeInject-onedir.zip SkyBadgeInject)
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('SkyBadgeInject-onedir.zip')
          names = z.namelist()
          assert 'SkyBadgeInject/SkyBadgeInject.exe' in names
          assert 'SkyBadgeInject/config.json' in names
          assert any(n.startswith('SkyBadgeInject/_internal/') for n in names)
          assert z.testzip() is None
          print(len(names), 'entries OK')
          PY
      - name: Stage Windows artifacts
        shell: bash
        run: cp dist/onefile/SkyBadgeInject.exe SkyBadgeInject.exe
      - uses: actions/upload-artifact@v4
        with:
          name: skybadge-windows
          path: |
            SkyBadgeInject.exe
            SkyBadgeInject-onedir.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: skybadge-injector
          path: dist/injector/SkyBadgeInjector.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK (release signed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/skybadge-release.jks"
          test -s "$RUNNER_TEMP/skybadge-release.jks"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/skybadge-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          cd android
          ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature and metadata
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          APK="$PWD/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK_ROOT/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$BT/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 3
          printf '%s\n' "$BADGING" | grep -q "package: name='com.skybadge.relay'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='$ANDROID_VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -q "versionName='$ANDROID_VERSION_NAME'"
          cp "$APK" "$GITHUB_WORKSPACE/SkyBadgeRelay.apk"
          sha256sum SkyBadgeRelay.apk
      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/skybadge-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: skybadge-android
          path: SkyBadgeRelay.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish rolling latest
    needs: [hook-dll, windows, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true
      - name: Verify artifacts and assemble bundle
        run: |
          set -euo pipefail
          ls -lR release-assets
          test -f release-assets/SkyBadgeInject.exe
          test -f release-assets/SkyBadgeInjector.exe
          test -f release-assets/SkyBadgeInject-onedir.zip
          test -f release-assets/sky_hook.dll
          test -f release-assets/SkyBadgeRelay.apk
          mkdir -p bundle/SkyBadge-Windows
          cp release-assets/SkyBadgeInject.exe bundle/SkyBadge-Windows/
          cp release-assets/SkyBadgeInjector.exe bundle/SkyBadge-Windows/
          cp release-assets/sky_hook.dll bundle/SkyBadge-Windows/
          cp config.json bundle/SkyBadge-Windows/
          cp README.md bundle/SkyBadge-Windows/
          (cd bundle && zip -9 -r "$GITHUB_WORKSPACE/SkyBadge-Windows.zip" SkyBadge-Windows)
          unzip -l SkyBadge-Windows.zip
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          rm -f release-assets/SHA256SUMS
          (cd release-assets && sha256sum \
            SkyBadgeInject.exe SkyBadgeInjector.exe sky_hook.dll \
            SkyBadgeInject-onedir.zip SkyBadgeRelay.apk > SHA256SUMS)
          (cd "$GITHUB_WORKSPACE" && sha256sum \
            SkyBadge-Windows.zip config.json README.md >> release-assets/SHA256SUMS)
          cat release-assets/SHA256SUMS
      - name: Move rolling latest tag
        run: |
          set -euo pipefail
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SkyBadge for Windows + Android (latest)
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            Rolling Windows + Android build from `main` at ${{ github.sha }}.
            Game build: ${{ env.GAME_BUILD }}.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            | Asset | Contents |
            | --- | --- |
            | `SkyBadge-Windows.zip` | Full onefile package: main tool, injector, hook DLL, config, README |
            | `SkyBadgeInject-onedir.zip` | Alternative folder build of the main tool (faster startup) |
            | `SkyBadgeInject.exe` | Main tool, single file |
            | `SkyBadgeInjector.exe` | DLL injector (run as Administrator if Sky is elevated) |
            | `sky_hook.dll` | Hook loaded into Sky.exe |
            | `config.json` | Editable config; place next to the exe |
            | `SkyBadgeRelay.apk` | Release-signed Android app (Android 8.0+, NFC required) |
            | `SHA256SUMS` | Checksums for all release binaries |

            Windows quick start: start Sky and log in -> run `SkyBadgeInjector.exe` -> run `SkyBadgeInject.exe` -> choose 1 (reader) or 2 (phone). No Python installation is required.

            Android: install `SkyBadgeRelay.apk`, enter the PC IP and the `remote.token` from `config.json`. versionCode: ${{ github.run_number }}.
            If you previously installed the debug APK, uninstall it once first (`adb uninstall com.skybadge.relay`); app settings are not preserved.

            This release and its assets are replaced on every push to `main`.
          files: |
            release-assets/SkyBadgeInject.exe
            release-assets/SkyBadgeInjector.exe
            release-assets/sky_hook.dll
            config.json
            README.md
            SkyBadge-Windows.zip
            release-assets/SkyBadgeInject-onedir.zip
            release-assets/SkyBadgeRelay.apk
            release-assets/SHA256SUMS
